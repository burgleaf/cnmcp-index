name: Deploy Discovery Production

on:
  push:
    branches: [main]
    paths:
      - "discovery/**"
      - "scripts/check-cloudflare-prerequisites.mjs"
      - "scripts/smoke-deployment.mjs"
      - ".github/workflows/deploy-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-discovery
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, deploy and smoke test
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCOVERY_API_URL: https://cnmcp-discovery-api.burgleaf.workers.dev
      PRODUCTION_SITE_URL: https://www.cnmcp.com
    steps:
      - name: Checkout default branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: discovery/package-lock.json

      - name: Install Discovery Worker dependencies from npm lockfile
        run: npm ci --prefix discovery --ignore-scripts

      - name: Run Discovery lint, typecheck and tests
        run: npm --prefix discovery run check

      - name: Build Discovery deployment bundle without upload
        run: npm --prefix discovery run dry-run

      - name: Validate protected deployment prerequisites
        run: node scripts/check-cloudflare-prerequisites.mjs environment discovery

      - name: Verify GITHUB_TOKEN is preconfigured in Cloudflare
        run: |
          node discovery/node_modules/wrangler/bin/wrangler.js secret list --config discovery/wrangler.jsonc --format json > "$RUNNER_TEMP/discovery-secrets.json"
          node scripts/check-cloudflare-prerequisites.mjs github-token "$RUNNER_TEMP/discovery-secrets.json"

      - name: Apply remote D1 migrations
        run: node discovery/node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config discovery/wrangler.jsonc --file=discovery/migrations/0001_discovery.sql

      - name: Deploy Discovery Worker
        run: node discovery/node_modules/wrangler/bin/wrangler.js deploy --config discovery/wrangler.jsonc --strict

      - name: Smoke test Discovery protocol and privacy boundaries
        run: node scripts/smoke-deployment.mjs --target discovery --base-url "$DISCOVERY_API_URL" --origin "$PRODUCTION_SITE_URL"
