name: Deploy Worker Production

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/sync-stats-catalog.mjs"
      - "scripts/lib/stats-catalog-sync.mjs"
      - "scripts/check-cloudflare-prerequisites.mjs"
      - "scripts/smoke-deployment.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, sync, deploy and smoke test
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_API_URL: https://api.cnmcp.com
      PRODUCTION_SITE_URL: https://www.cnmcp.com
    steps:
      - name: Checkout default branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install root dependencies from Yarn lockfile
        run: node .yarn/releases/yarn-1.22.19.cjs install --frozen-lockfile --non-interactive

      - name: Install Worker dependencies from npm lockfile
        run: npm ci --prefix worker --ignore-scripts

      - name: Validate and generate content catalog
        run: |
          node .yarn/releases/yarn-1.22.19.cjs validate:resources
          node .yarn/releases/yarn-1.22.19.cjs generate:catalog

      - name: Run Worker lint, typecheck and tests
        run: npm --prefix worker run check

      - name: Build Worker deployment bundle without upload
        run: npm --prefix worker run dry-run

      - name: Validate protected deployment prerequisites
        run: node scripts/check-cloudflare-prerequisites.mjs environment worker

      - name: Verify HASH_SALT is preconfigured in Cloudflare
        run: |
          node worker/node_modules/wrangler/bin/wrangler.js secret list --config worker/wrangler.jsonc --format json > "$RUNNER_TEMP/worker-secrets.json"
          node scripts/check-cloudflare-prerequisites.mjs hash-salt "$RUNNER_TEMP/worker-secrets.json"

      - name: Apply remote D1 migrations
        run: node worker/node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config worker/wrangler.jsonc --file=worker/migrations/0001_initial_stats.sql

      - name: Synchronize remote D1 resource catalog
        run: node scripts/sync-stats-catalog.mjs --remote --database cnmcp-stats --config worker/wrangler.jsonc

      - name: Deploy Worker
        run: node worker/node_modules/wrangler/bin/wrangler.js deploy --config worker/wrangler.jsonc --strict

      - name: Smoke test Worker protocol and privacy boundaries
        run: node scripts/smoke-deployment.mjs --target worker --base-url "$WORKER_API_URL" --origin "$PRODUCTION_SITE_URL"
