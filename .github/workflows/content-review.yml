name: Content Maintainer Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: content-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-content-review:
    name: Protected Content Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check protected paths, maintainer approval and featured changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-content-review.mjs
