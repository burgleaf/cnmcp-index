name: Deploy Pages Production

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "resources/**"
      - "catalog/**"
      - "schemas/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.ts"
      - "tsconfig.json"
      - "tailwind.config.js"
      - "postcss.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, gate, sync, build, smoke and publish
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_SITE_URL: https://www.cnmcp.com
      NEXT_PUBLIC_SITE_URL: https://www.cnmcp.com
      NEXT_PUBLIC_STATS_API_URL: https://api.cnmcp.com
      NEXT_PUBLIC_GITHUB_REPOSITORY_URL: https://github.com/burgleaf/cnmcp-index
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout default branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install root dependencies from Yarn lockfile
        run: node .yarn/releases/yarn-1.22.19.cjs install --frozen-lockfile --non-interactive

      - name: Install locked Wrangler CLI
        run: npm ci --prefix worker --ignore-scripts

      - name: Validate resource content
        run: node .yarn/releases/yarn-1.22.19.cjs validate:resources

      - name: Generate deterministic catalogs
        run: node .yarn/releases/yarn-1.22.19.cjs generate:catalog

      - name: Require matching Worker deployment when Worker paths changed
        run: node scripts/wait-worker-deployment.mjs

      - name: Validate protected deployment prerequisites
        run: node scripts/check-cloudflare-prerequisites.mjs environment pages

      - name: Synchronize remote D1 resource catalog
        run: node scripts/sync-stats-catalog.mjs --remote --database cnmcp-stats --config worker/wrangler.jsonc

      - name: Build root static export
        run: node .yarn/releases/yarn-1.22.19.cjs build

      - name: Write non-sensitive build summary
        run: node scripts/ci-build-summary.mjs

      - name: Deploy immutable candidate to Pages
        id: candidate
        env:
          CANDIDATE_BRANCH: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          node worker/node_modules/wrangler/bin/wrangler.js pages deploy out --project-name cnmcp-index --branch "$CANDIDATE_BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/pages-candidate.log"
          node scripts/extract-pages-deployment-url.mjs "$RUNNER_TEMP/pages-candidate.log"

      - name: Smoke test candidate static deployment
        run: node scripts/smoke-deployment.mjs --target pages --base-url "${{ steps.candidate.outputs.url }}"

      - name: Publish verified artifact to Pages production
        run: node worker/node_modules/wrangler/bin/wrangler.js pages deploy out --project-name cnmcp-index --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=false
