name: AI Candidate Review

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Candidate Issue number
        required: true
        type: number
      force:
        description: Re-run even when the upstream revision was reviewed
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: node .yarn/releases/yarn-1.22.19.cjs install --frozen-lockfile --non-interactive

      - name: Review candidate and update Issue report
        env:
          AI_REVIEW_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AI_REVIEW_FORCE: ${{ inputs.force || false }}
          AI_REVIEW_TIMEOUT_MS: "60000"
          AI_REVIEW_MAX_TOKENS: "3000"
          AI_REVIEW_MAX_ATTEMPTS: "3"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-pro
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ai-review-candidate.mjs
